name: SolitaireSaver
options:
  bundleIdPrefix: se.jbe
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    MARKETING_VERSION: "1.0.0"
targets:
  SolitaireSaver:
    type: bundle
    platform: macOS
    sources:
      - Sources
      - path: Resources
        optional: true
    settings:
      base:
        PRODUCT_NAME: Solitaire Win
        PRODUCT_BUNDLE_IDENTIFIER: se.jbe.solitairewin
        WRAPPER_EXTENSION: saver
        INSTALL_PATH: $(HOME)/Library/Screen Savers
    info:
      path: Support/Saver-Info.plist
      properties:
        CFBundleDisplayName: Solitaire Win
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        NSPrincipalClass: SolitaireSaverView
    scheme: {}
  Harness:
    type: application
    platform: macOS
    sources:
      - Sources
      - Harness
      - path: Resources
        optional: true
    settings:
      base:
        PRODUCT_NAME: Solitaire Harness
        PRODUCT_BUNDLE_IDENTIFIER: se.jbe.solitairewin.harness
    info:
      path: Support/Harness-Info.plist
      properties:
        NSPrincipalClass: NSApplication
    scheme: {}
